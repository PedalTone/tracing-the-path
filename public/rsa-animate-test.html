  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  #rsa-animate-test .rsa-light { stroke:var(--muted-foreground); stroke-width:1.8; }
  #rsa-animate-test .rsa-accent { stroke:var(--viz-series-1); stroke-width:3.8; }
  #rsa-animate-test .rsa-arrow { stroke:var(--viz-series-2); stroke-width:3.4; }
  #rsa-animate-test .rsa-reveal { opacity:0; fill:var(--foreground); font-family:&quot;Bradley Hand&quot;,&quot;Segoe Print&quot;,&quot;Comic Sans MS&quot;,cursive; font-weight:400; letter-spacing:.5px; }
  #rsa-animate-test .rsa-name,#rsa-animate-test .rsa-label { font-size:28px; }
  #rsa-animate-test .rsa-big-number { font-size:38px; fill:var(--viz-series-2); }
  #rsa-animate-test .rsa-hero-number { font-size:66px; fill:var(--viz-series-1); }
  #rsa-animate-test .rsa-takeaway { font-size:27px; fill:var(--foreground); }

  @media (max-width:520px) {
    #rsa-animate-test .rsa-canvas { aspect-ratio:4/3; }
    #rsa-animate-test .rsa-takeaway { font-size:18px; }
  }
  @media (prefers-reduced-motion:reduce) {
    #rsa-animate-test .rsa-pencil { display:none; }

&lt;/style&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;rsa-animate-test&#x27;);
    const playButton = root.querySelector(&#x27;[data-action=&quot;play&quot;]&#x27;);
    const resetButton = root.querySelector(&#x27;[data-action=&quot;reset&quot;]&#x27;);
    const scrubber = root.querySelector(&#x27;[data-scrub]&#x27;);
    const timeLabel = root.querySelector(&#x27;[data-time]&#x27;);
    const caption = root.querySelector(&#x27;[data-caption]&#x27;);
    const pencil = root.querySelector(&#x27;[data-pencil]&#x27;);
    const duration = 38;
    const strokeItems = [...root.querySelectorAll(&#x27;.rsa-stroke&#x27;)];
    const revealItems = [...root.querySelectorAll(&#x27;.rsa-reveal&#x27;)];
    let current = 0;
    let running = false;
    let anchor = 0;
    let base = 0;
    let frame = 0;
    let narrationStarted = false;

    const script = &quot;Every morning, Maya bought coffee in a disposable cup. One cup seemed harmless. But one cup each weekday became two hundred and sixty cups a year. So she tried one small change: a reusable mug. The first week saved five cups. Soon, her coworkers copied her. Five people became twenty. By the end of the year, one small habit had prevented more than five thousand cups from entering the bin. Big changes do not always begin with big plans. Sometimes they begin with one object used again.&quot;;

    const captions = [
      [0,&quot;Every morning, Maya bought coffee in a disposable cup.&quot;],
      [4.6,&quot;One cup seemed harmless.&quot;],
      [7.2,&quot;But one cup each weekday became 260 cups a year.&quot;],
      [12.5,&quot;So she tried one small change: a reusable mug.&quot;],
      [17,&quot;The first week saved five cups.&quot;],
      [20.8,&quot;Soon, her coworkers copied her.&quot;],
      [24.5,&quot;Five people became twenty.&quot;],
      [28.4,&quot;By year’s end, one small habit had kept more than 5,000 cups out of the bin.&quot;],
      [34,&quot;Big changes do not always begin with big plans.&quot;],
      [36.2,&quot;Sometimes they begin with one object used again.&quot;],
    ];

    strokeItems.forEach((item) =&gt; {
      const length = item.getTotalLength();
      item.dataset.length = String(length);
      item.style.strokeDasharray = String(length);
      item.style.strokeDashoffset = String(length);
    });

    function clamp(value) { return Math.max(0,Math.min(1,value)); }
    function formatTime(value) { return `0:${Math.floor(value).toString().padStart(2,&#x27;0&#x27;)} / 0:38`; }

    function render(time) {
      let activeStroke = null;
      strokeItems.forEach((item) =&gt; {
        const start = Number(item.dataset.start);
        const span = Number(item.dataset.duration);
        const progress = clamp((time-start)/span);
        const length = Number(item.dataset.length);
        item.style.strokeDashoffset = String(length*(1-progress));
        item.style.opacity = time &lt; start ? &#x27;0&#x27; : &#x27;1&#x27;;
        if (progress &gt; 0 &amp;&amp; progress &lt; 1) activeStroke = {item,progress};
      });
      revealItems.forEach((item) =&gt; {
        const start = Number(item.dataset.start);
        const span = Number(item.dataset.duration);
        const progress = clamp((time-start)/span);
        item.style.opacity = String(progress);
        item.style.transform = `translateY(${(1-progress)*8}px)`;
      });
      if (activeStroke) {
        const length = activeStroke.item.getTotalLength();
        const point = activeStroke.item.getPointAtLength(length*activeStroke.progress);
        pencil.setAttribute(&#x27;cx&#x27;,String(point.x));
        pencil.setAttribute(&#x27;cy&#x27;,String(point.y));
        pencil.style.opacity = &#x27;1&#x27;;
      } else {
        pencil.style.opacity = &#x27;0&#x27;;
      }
      const activeCaption = [...captions].reverse().find(([at]) =&gt; time &gt;= at);
      caption.textContent = activeCaption ? activeCaption[1] : &#x27;Press play to hear the short story and watch its meaning accumulate.&#x27;;
      scrubber.value = String(time);
      timeLabel.textContent = formatTime(time);
    }

    function tick(now) {
      if (!running) return;
      current = Math.min(duration,base+(now-anchor)/1000);
      render(current);
      if (current &gt;= duration) {
        running = false;
        playButton.textContent = &#x27;Replay narrated drawing&#x27;;
        return;
      }
      frame = requestAnimationFrame(tick);
    }

    function speakFromStart() {
      if (!(&#x27;speechSynthesis&#x27; in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(script);
      utterance.rate = 0.91;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
      narrationStarted = true;
    }

    playButton.addEventListener(&#x27;click&#x27;,() =&gt; {
      if (running) {
        running = false;
        cancelAnimationFrame(frame);
        if (narrationStarted &amp;&amp; &#x27;speechSynthesis&#x27; in window) window.speechSynthesis.pause();
        playButton.textContent = &#x27;Continue drawing&#x27;;
        return;
      }
      if (current &gt;= duration-0.1) current = 0;
      if (current &lt; 0.1) speakFromStart();
      else if (narrationStarted &amp;&amp; &#x27;speechSynthesis&#x27; in window) window.speechSynthesis.resume();
      base = current;
      anchor = performance.now();
      running = true;
      playButton.textContent = &#x27;Pause&#x27;;
      frame = requestAnimationFrame(tick);
    });

    resetButton.addEventListener(&#x27;click&#x27;,() =&gt; {
      running = false;
      cancelAnimationFrame(frame);
      if (&#x27;speechSynthesis&#x27; in window) window.speechSynthesis.cancel();
      narrationStarted = false;
      current = 0;
      playButton.textContent = &#x27;Play narrated drawing&#x27;;
      render(0);
    });

    scrubber.addEventListener(&#x27;input&#x27;,() =&gt; {
      running = false;
      cancelAnimationFrame(frame);
      if (&#x27;speechSynthesis&#x27; in window) window.speechSynthesis.cancel();
      narrationStarted = false;
      current = Number(scrubber.value);
      playButton.textContent = current &gt;= duration-0.1 ? &#x27;Replay narrated drawing&#x27; : &#x27;Continue drawing&#x27;;
      render(current);
    });

    render(0);
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
